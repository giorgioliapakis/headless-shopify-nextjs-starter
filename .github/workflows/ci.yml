name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.5.0
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies without credentials
        run: pnpm install --frozen-lockfile
      - name: Run deterministic quality gate
        run: pnpm check
      - name: Build neutral fixture and enforce asset budgets
        run: pnpm verify:production

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.5.0
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm browser:install
      - name: Build neutral production fixture
        run: pnpm verify:production
      - name: Run desktop, mobile, no-JavaScript and accessibility journeys
        run: pnpm browser:test:built
      - name: Enforce route Lighthouse budgets
        run: pnpm lighthouse:built
      - name: Preserve failed Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-failure-${{ github.run_id }}
          path: .artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 7
