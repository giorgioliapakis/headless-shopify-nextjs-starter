name: Release evidence

on:
  workflow_dispatch:
    inputs:
      attest:
        description: Generate GitHub provenance and SBOM attestations when the repository plan supports them
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.5.0
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate clean release archive, SBOM and local evidence
        run: pnpm release:verify
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: .release/agentic-shopify-starter-0.1.0.tar
      - name: Attest CycloneDX SBOM
        if: inputs.attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: .release/agentic-shopify-starter-0.1.0.tar
          sbom-path: .release/sbom.cdx.json
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-shopify-starter-${{ github.sha }}
          path: |
            .release/agentic-shopify-starter-0.1.0.tar
            .release/release-report.json
            .release/sbom.cdx.json
            .release/license-inventory.json
            .release/source-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
